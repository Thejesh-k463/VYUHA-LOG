name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0   # PINNED — see the note in release.yml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Next.js build
        run: npm run build

  # WHY THIS JOB EXISTS.
  #
  # Until 2026-08-12 nothing in CI ran on Windows: the jobs here are ubuntu and
  # macOS, and the only Windows build in the whole pipeline was the release
  # workflow — which runs AFTER a tag is pushed. So every Windows-only breakage
  # was guaranteed to be discovered as a broken release, and three were, in a
  # row: a DPAPI test timing out on a cold runner (v2.99.91), a transient
  # prebuild download (v2.99.92), and a runner-image Node bump that left
  # better-sqlite3 with no prebuilt binary and no working node-gyp fallback
  # (v2.99.92 again). Each shipped a release with no Windows installer.
  #
  # This job is the cheap half of the release gate — npm ci, typecheck, unit
  # tests — on the same OS the installer is built on. It is deliberately NOT
  # the full build: the point is to fail on a push, on the thing that actually
  # keeps failing, which is installing native dependencies on Windows.
  windows-gate:
    name: Windows install + tests (what the release job needs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0   # PINNED — see the note in release.yml
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt of 3) — retrying"
            rm -rf node_modules || true
            sleep 15
          done
          echo "::error::npm ci failed three times — this is not a transient download"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: Playwright e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A macOS-only failure must still be visible when Linux is green, and vice
      # versa — that difference is the entire reason for running both.
      fail-fast: false
      matrix:
        # ubuntu is the fast signal on every push. macOS is here because the
        # desktop app now ships for it: better-sqlite3 loads a different prebuilt
        # binary, paths are case-sensitive with a different separator, and the
        # per-user data dir resolves somewhere else entirely. None of that is
        # exercised by a Linux run.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0   # PINNED — see the note in release.yml
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps installs system libraries via apt and is Linux-only; on
      # macOS it fails outright, so the browser download runs without it.
      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Run e2e (spins up its own isolated DB + dev server on :3100)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Matrix legs cannot share an artifact name — a collision fails the
          # upload and you lose the report for the leg you actually need.
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # Proves the desktop bundle assembles on macOS: the Next standalone build, the
  # seeded template DB, and the per-arch Node sidecar with its execute bit. This
  # is the part that cannot be checked from a Windows dev box at all. It stops
  # short of `tauri build`, which would add several minutes of Rust compilation
  # to every push — the release workflow covers that on tag.
  desktop-bundle-macos:
    name: Desktop bundle assembles (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0   # PINNED — see the note in release.yml
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Create the database BEFORE the build.
      #
      # `next build` collects page data with several worker processes, and any
      # route reaching a query imports lib/db in each of them. On a fresh
      # checkout there is no data/vyuha.sqlite, so those workers race to create
      # the same file and set journal_mode=WAL on it — which needs a brief
      # exclusive lock and returns SQLITE_BUSY immediately rather than honouring
      # busy_timeout. macOS lost that race; Linux happened not to.
      #
      # Migrating first means the file already exists and is already in WAL, so
      # no worker has to change the mode and there is nothing to contend over.
      # (lib/db also tolerates the pragma failing now, but not needing it at all
      # is the deterministic fix rather than the hopeful one.)
      - name: Create the database first (removes the build-time WAL race)
        run: npm run db:migrate

      - name: Build web bundle + assemble desktop-dist
        run: npm run build && npm run desktop:bundle

      - name: Assert the sidecar is present, native and executable
        run: |
          set -euo pipefail
          test -f desktop-dist/.next/BUILD_ID
          test -f desktop-dist/desktop-server.mjs
          test -f desktop-dist/vyuha.seed.sqlite
          test -x desktop-dist/node/node
          file desktop-dist/node/node | tee /dev/stderr | grep -q "arm64"
          desktop-dist/node/node --version
          echo "✓ macOS desktop bundle is complete and runnable"

  # The load and stress suite (tests/load/*.load.ts) is excluded from `npm test`
  # BY CONSTRUCTION (vitest.load.config.ts) so a five-minute seed can never creep
  # into the unit suite — which also meant nothing ran it. Since 2026-09-04 it is
  # its own required gate: the release skill (§6) lists it beside the jobs above.
  # Budget: one local run took 113 s wall (16 files, single-file, forks pool);
  # ×2 = 4 min for the step, plus checkout + npm ci on a cold runner.
  load:
    name: Load and stress suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0   # PINNED — see the note in release.yml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load suite
        run: npm run test:load
